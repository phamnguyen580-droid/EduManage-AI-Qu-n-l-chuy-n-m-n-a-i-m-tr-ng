<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduManage AI V3 – Quản lý chuyên môn đa điểm trường</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a5c;--blue:#2563eb;--bg:#f3f6fb;--card:#fff;--tx:#14213d;--mu:#5b6b88;--ln:#e1e8f2;--ok:#15803d;--wa:#b45309;--er:#dc2626;--okb:#dcfce7;--wab:#fef3c7;--erb:#fee2e2;--sel:#e8f0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1426;--card:#121f3a;--tx:#e6ecf8;--mu:#94a3c4;--ln:#243558;--sel:#1b2f5c;--okb:#12351f;--wab:#3b2c0a;--erb:#3d1414;--ok:#4ade80;--wa:#fbbf24;--er:#f87171}}
:root[data-theme="dark"]{--bg:#0b1426;--card:#121f3a;--tx:#e6ecf8;--mu:#94a3c4;--ln:#243558;--sel:#1b2f5c;--okb:#12351f;--wab:#3b2c0a;--erb:#3d1414;--ok:#4ade80;--wa:#fbbf24;--er:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Be Vietnam Pro',system-ui,Arial,sans-serif}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--navy);color:#cfdcf7;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:700;color:#fff;font-size:16px;padding:4px 10px 14px}.logo small{display:block;font-weight:400;color:#8fa6d6;font-size:12px}
.ng{font-size:12px;color:#8fa6d6;padding:12px 12px 4px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button:hover{background:#1b3a78}nav button.on{background:var(--blue);color:#fff;font-weight:600}
main{min-width:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--ln)}
.top h1{font-size:17px;margin:0}.top p{margin:0;color:var(--mu);font-size:12.5px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.av{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600}
.ban{background:var(--wab);color:var(--wa);padding:8px 24px;font-size:12.5px}
.ct{padding:20px 24px;display:grid;gap:16px}.ct>h2{font-size:19px;margin:0}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
select,input,textarea{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx)}
.btn{background:var(--blue);color:#fff;border:0;padding:9px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--ln)}.btn:disabled{opacity:.45;cursor:default}
:is(.btn,nav button,select,input,textarea,tr.cl,.kpi):focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:16px;color:var(--tx)}
button.kpi{text-align:left;font:inherit;cursor:pointer}button.kpi:hover{border-color:var(--blue)}
.kpi b{display:block;font-size:25px;line-height:1.2}.kpi span{display:block;font-size:12.5px;font-weight:600}.kpi small{color:var(--mu);font-size:11.5px}
.kpi.er b{color:var(--er)}.kpi.wa b{color:var(--wa)}.kpi.ok b{color:var(--ok)}
h2{font-size:15px;margin:0 0 10px}h3{font-size:13.5px;margin:14px 0 6px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:9px 10px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12.5px}
tr.cl{cursor:pointer}tr.cl:hover{background:var(--sel)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.p-ok{background:var(--okb);color:var(--ok)}.p-wa{background:var(--wab);color:var(--wa)}.p-er{background:var(--erb);color:var(--er)}.p-mu{background:var(--sel);color:var(--blue)}
.hb{display:grid;grid-template-columns:130px 1fr 92px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.tr{height:12px;background:var(--sel);border-radius:6px;overflow:hidden}.tr i{display:block;height:100%;background:var(--blue)}
.ai li{margin:7px 0}a.l{color:var(--blue);cursor:pointer;text-decoration:underline}
.note{color:var(--mu);font-size:12.5px}.empty{text-align:center;padding:40px 10px;color:var(--mu)}
dialog{border:0;border-radius:12px;padding:20px;width:min(560px,94vw);max-height:90vh;background:var(--card);color:var(--tx)}dialog::backdrop{background:#0008}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:13px}dialog input:not([type=file]),dialog select,dialog textarea{width:100%}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99}#toast.e{background:var(--er)}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto}nav{display:flex;overflow-x:auto;gap:4px;align-items:center}nav button{white-space:nowrap;width:auto}.ng{display:none}.ct,.top,.ban{padding-left:14px;padding-right:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app">
<aside><div class="logo">EduManage AI<small>Quản lý chuyên môn đa điểm trường</small></div><nav id="nav"></nav></aside>
<main>
<div class="top"><div><h1>Trường Tiểu học Đỗ Thúc Tịnh</h1><p>Năm học 2026–2027 · Học kỳ I</p></div>
<div class="who"><select id="rl" onchange="role=this.value;selId=null;render()" aria-label="Xem thử theo vai trò"><option value="bgh">Xem thử: Ban giám hiệu</option><option value="tt">Xem thử: Tổ trưởng</option><option value="gv">Xem thử: Giáo viên</option><option value="ad">Xem thử: Quản trị</option></select>
<button class="btn g" onclick="bell()" aria-label="Thông báo">🔔 <span id="bc"></span></button><button class="btn g" onclick="theme()" aria-label="Đổi chế độ sáng/tối">◐</button>
<div><b id="un"></b><br><span class="note" id="ul"></span></div><div class="av" id="av"></div></div></div>
<div class="ban" id="ban"></div>
<div class="ct" id="v"></div></main></div>
<dialog id="dlg"></dialog>
<dialog id="cf"><p id="cm"></p><div class="bar"><span class="sp"></span><button class="btn g" onclick="$('cf').close()">Hủy</button><button class="btn" id="cy">Xác nhận</button></div></dialog>
<div id="toast" role="status"></div>
<script>
const KEY='edm-v3',OLD='edm-v2',TZ='Asia/Ho_Chi_Minh',BASE=Date.UTC(2026,8,21),PG=10;
const nowTs=()=>new Date().toLocaleString('sv-SE',{timeZone:TZ}),TODAY=nowTs().slice(0,10);
const wkOf=iso=>Math.floor((Date.parse(iso.slice(0,10))-BASE)/6048e5)+1,CW=wkOf(TODAY);
const SUB=['Đã nộp','Đang rà soát','Cần chỉnh sửa','Chờ duyệt','Đã duyệt','Từ chối'];
const ALLST=['Chưa nộp','Bản nháp','Đã nộp','Đang rà soát','Cần chỉnh sửa','Chờ duyệt','Đã duyệt','Từ chối','Thu hồi'];
const STC={'Đã duyệt':'ok','Chờ duyệt':'wa','Đang rà soát':'wa','Cần chỉnh sửa':'er','Từ chối':'er','Chưa nộp':'er'};
const TY=['Kế hoạch bài dạy','Kế hoạch giáo dục','Biên bản sinh hoạt','Phiếu dự giờ','Báo cáo chuyên môn'],TO=['Tổ khối 1–2','Tổ khối 3','Tổ khối 4–5'];
const AC={nop:['Đã nộp','Nộp hồ sơ'],thuhoi:['Thu hồi','Thu hồi hồ sơ'],ver:['Đã nộp','Nộp phiên bản mới'],rs:['Đang rà soát','Bắt đầu rà soát'],cho:['Chờ duyệt','Chuyển chờ duyệt'],duyet:['Đã duyệt','Phê duyệt'],sua:['Cần chỉnh sửa','Yêu cầu chỉnh sửa'],tc:['Từ chối','Từ chối hồ sơ']};
const R={bgh:{n:'Ngô Thị Bông',l:'Phó Hiệu trưởng'},tt:{n:'Trần Văn Hòa',l:'Tổ trưởng chuyên môn'},gv:{n:'Nguyễn Thị Lan',l:'Giáo viên',tid:'GV001'},ad:{n:'Quản trị hệ thống',l:'Quản trị viên'}};
const $=id=>document.getElementById(id),pc=(a,b)=>Math.round(a/b*100),fr=r=>r==null?'—':r+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cnt=(ds,s)=>ds.filter(d=>d.st==s).length,pill=(s,c)=>`<span class="pill p-${c||STC[s]||'mu'}">${esc(s)}</span>`;
const opt=(a,v)=>a.map(([k,l])=>`<option value="${esc(k)}"${k==v?' selected':''}>${esc(l)}</option>`).join('');
const day=w=>new Date(BASE+(w-1)*6048e5).toISOString().slice(0,10);
function seed(){let r=11;const Rn=()=>(r=(r*1103515245+12345)%2147483648)/2147483648,pk=a=>a[Math.floor(Rn()*a.length)];
const nm=[['Điểm trường chính','Ngô Thị Bông',24,.92],['Phân hiệu 1','',12,.8],['Phân hiệu 2','',9,.9],['Phân hiệu 3','',6,.62]];
const D={v:3,upd:'Dữ liệu mẫu ban đầu',schools:[],teachers:[],docs:[],tasks:[],audit:[]};
const fem=['Lan','Mai','Hạnh','Thu','Yến','Linh','Dung'],mal=['Hòa','Nam','Hùng','Tâm','Phúc','Long'],ho=['Nguyễn','Trần','Lê','Phạm','Võ','Đặng','Hoàng'];
const due=['2026-11-05','2026-10-15','2026-10-25','2026-09-30'],dn=['Kế hoạch bài dạy tuần 9','Kế hoạch giáo dục cá nhân học kỳ I','Biên bản sinh hoạt tổ tháng 10','Phiếu dự giờ tháng 10'],ty=[0,1,2,3];
let ti=0,di=0;
nm.forEach((x,i)=>{const sid='DT0'+(i+1);D.schools.push({id:sid,code:sid,name:x[0],addr:'',pt:x[1],ct:'',active:true,hist:[{at:TODAY,by:'Hệ thống',act:'Tạo dữ liệu mẫu'}]});
for(let k=0;k<x[2];k++){ti++;const g=k%3==2,name=ti==1?'Nguyễn Thị Lan':pk(ho)+(g?' Văn ':' Thị ')+pk(g?mal:fem),t={id:'GV'+String(ti).padStart(3,'0'),name,sid,to:TO[k%3]};D.teachers.push(t);
for(let j=0;j<4;j++){di++;const fx=i%2?.1:0;let st;if(Rn()>x[3])st=Rn()<.5?'Bản nháp':'Chưa nộp';else{const q=Rn();st=q<.12+fx?'Cần chỉnh sửa':q<.27+fx?'Đang rà soát':q<.42+fx?'Chờ duyệt':q<.52+fx?'Đã nộp':'Đã duyệt'}
const wk=1+Math.floor(Rn()*6),sb=SUB.includes(st),d={id:'HS'+String(di).padStart(4,'0'),name:dn[j],ty:TY[ty[j]],tid:t.id,tname:name,sid,to:t.to,mo:+due[j].slice(5,7),due:due[j],st,upd:sb?day(wk):TODAY,ver:[],log:[]};
if(sb){d.ver.push({v:1,by:name,at:day(wk),note:'Bản đầu',file:''});d.log.push({at:day(wk),by:name+' (Giáo viên)',act:'Nộp hồ sơ',note:''});if(st=='Đã duyệt')d.log.push({at:day(wk),by:'Ngô Thị Bông (Phó Hiệu trưởng)',act:'Phê duyệt',note:''})}
D.docs.push(d)}}});
D.tasks=[['Nộp biên bản sinh hoạt tổ tháng 10','DT02','2026-10-25'],['Nộp kế hoạch bài dạy tuần 9','DT04','2026-10-20'],['Nộp phiếu dự giờ tháng 10','DT04','2026-10-26'],['Nộp báo cáo chuyên môn tháng 10','DT01','2026-10-27'],['Nộp kế hoạch giáo dục tổ học kỳ I','all','2026-11-05']].map((x,i)=>({id:'NV0'+(i+1),title:x[0],sid:x[1],due:x[2],done:false}));
return D}
let D,persistOK=true,role='bgh',cur=0,selId=null;
function migrate(x){if(!x||typeof x!='object')return null;if(x.v==2&&Array.isArray(x.docs)&&Array.isArray(x.tasks)){x.docs.forEach(d=>delete d.wk);x.v=3;x.migratedFrom=2}return x}
function validate(x){if(!x||x.v!==3||!['schools','teachers','docs','tasks','audit'].every(k=>Array.isArray(x[k])))return'cấu trúc tệp không đúng phiên bản V3';
if(x.schools.some(s=>!s.id||!s.name||!s.code))return'điểm trường thiếu mã hoặc tên';const cd=x.schools.map(s=>s.code.toLowerCase());if(new Set(cd).size!=cd.length)return'mã điểm trường trùng';
const sid=new Set(x.schools.map(s=>s.id)),tid=new Set(x.teachers.map(t=>t.id)),ids=new Set();
for(const d of x.docs){if(ids.has(d.id))return'mã hồ sơ trùng '+d.id;ids.add(d.id);if(!sid.has(d.sid)||!tid.has(d.tid))return'hồ sơ '+d.id+' tham chiếu điểm trường/giáo viên không tồn tại';if(!ALLST.includes(d.st))return'trạng thái không hợp lệ ở '+d.id;if(!Array.isArray(d.ver)||!Array.isArray(d.log))return'hồ sơ '+d.id+' thiếu phiên bản/nhật ký'}return''}
try{D=migrate(JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD)))}catch(e){D=null}
if(D&&validate(D))D=null;if(!D)D=seed();
function save(){D.upd=nowTs();try{localStorage.setItem(KEY,JSON.stringify(D));persistOK=true}catch(e){persistOK=false;toast('Không lưu được vào trình duyệt (đầy hoặc bị chặn). Hãy tải bản sao lưu.',1)}return persistOK}
const fl={sid:'',to:'',mo:'',df:'',dt:''},hf={st:'',ty:'',q:'',sort:'upd',pg:1};
const ME=()=>R[role],sn=id=>(D.schools.find(s=>s.id==id)||{}).name||id,doc=id=>D.docs.find(d=>d.id==id);
const overdue=t=>!t.done&&!!t.due&&t.due<TODAY,odDoc=d=>!!d.due&&d.due<TODAY&&!SUB.includes(d.st);
function aud(a){D.audit.unshift({at:nowTs().slice(0,16),by:ME().n,role:ME().l,act:a});D.audit.splice(100)}
function toast(m,e){const t=$('toast');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}
function ask(m,fn){$('cm').textContent=m;$('cy').onclick=()=>{$('cf').close();fn()};$('cf').showModal()}
function theme(){const h=document.documentElement,d=h.dataset.theme?h.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;h.dataset.theme=d?'light':'dark'}
/* Tầng tính toán */
const docsF=()=>D.docs.filter(d=>(!fl.sid||d.sid==fl.sid)&&(!fl.to||d.to==fl.to)&&(!fl.mo||d.mo==fl.mo)&&(!fl.df||(d.due&&d.due>=fl.df))&&(!fl.dt||(d.due&&d.due<=fl.dt))&&(role!='gv'||d.tid==R.gv.tid));
const gvSid=()=>(D.teachers.find(t=>t.id==R.gv.tid)||{}).sid;
const tasksF=()=>D.tasks.filter(t=>(!fl.sid||t.sid=='all'||t.sid==fl.sid)&&(role!='gv'||t.sid=='all'||t.sid==gvSid())&&(!fl.df||t.due>=fl.df)&&(!fl.dt||t.due<=fl.dt));
function stats(ds){const n=ds.length,sub=ds.filter(d=>SUB.includes(d.st)).length,ap=cnt(ds,'Đã duyệt'),fix=cnt(ds,'Cần chỉnh sửa'),ev=ap+fix+cnt(ds,'Từ chối');return{n,sub,not:n-sub,od:ds.filter(odDoc).length,rv:cnt(ds,'Đang rà soát'),fix,ap,wait:cnt(ds,'Chờ duyệt'),ev,rate:n?pc(sub,n):null,apr:ev?pc(ap,ev):null}}
function rows(){const all=docsF();return D.schools.filter(s=>!fl.sid||s.id==fl.sid).map(s=>{const ds=all.filter(d=>d.sid==s.id),w=n=>ds.filter(d=>d.ver.length&&wkOf(d.ver[0].at)==n).length,sb=t=>ds.filter(d=>d.ty==t&&SUB.includes(d.st)).length;
return{s,ds,st:stats(ds),gv:D.teachers.filter(t=>t.sid==s.id&&(!fl.to||t.to==fl.to)).length,bb:sb(TY[2]),dg:sb(TY[3]),od:D.tasks.filter(t=>overdue(t)&&(t.sid=='all'||t.sid==s.id)).length,tr:w(CW)-w(CW-1)}})}
/* Giao diện chung */
const filterBar=()=>`<div class="bar"><select aria-label="Điểm trường" onchange="fl.sid=this.value;hf.pg=1;render()">${opt([['','Tất cả điểm trường'],...D.schools.map(s=>[s.id,s.name])],fl.sid)}</select><select aria-label="Tổ chuyên môn" onchange="fl.to=this.value;hf.pg=1;render()">${opt([['','Tất cả tổ'],...TO.map(x=>[x,x])],fl.to)}</select><select aria-label="Tháng hạn nộp" onchange="fl.mo=this.value;hf.pg=1;render()">${opt([['','Học kỳ I (mọi tháng)'],['9','Hạn nộp tháng 9'],['10','Hạn nộp tháng 10'],['11','Hạn nộp tháng 11']],fl.mo)}</select><input type="date" aria-label="Hạn nộp từ ngày" value="${fl.df}" onchange="fl.df=this.value;hf.pg=1;render()"><span class="note">–</span><input type="date" aria-label="Hạn nộp đến ngày" value="${fl.dt}" onchange="fl.dt=this.value;hf.pg=1;render()"><span class="note">Cập nhật: ${esc(D.upd)}</span></div>`;
const empty=(t,m)=>`<div class="card empty"><b>${t}</b><p>${m}</p></div>`;
function docTable(ds){if(!ds.length)return'<div class="empty">Không có hồ sơ phù hợp. Hãy bỏ bớt bộ lọc hoặc tạo hồ sơ mới.</div>';
return`<div class="tw"><table><tr><th>Tên hồ sơ</th><th>Loại</th><th>Người nộp</th><th>Điểm trường</th><th>Hạn nộp</th><th>Phiên bản</th><th>Trạng thái</th></tr>${ds.map(d=>`<tr class="cl" tabindex="0" onkeydown="if(event.key=='Enter')openDoc('${d.id}')" onclick="openDoc('${d.id}')"><td>${esc(d.name)}</td><td>${esc(d.ty)}</td><td>${esc(d.tname)}</td><td>${esc(sn(d.sid))}</td><td>${d.due||'—'}</td><td>${d.ver.length||'—'}</td><td>${pill(d.st)}${odDoc(d)?' '+pill('Quá hạn','er'):''}</td></tr>`).join('')}</table></div>`}
function schoolTable(rs){return`<div class="tw"><table><tr><th>Điểm trường</th><th>GV</th><th>Hồ sơ cần nộp</th><th>Hoàn thành</th><th>Phê duyệt</th><th>Biên bản</th><th>Phiếu dự giờ</th><th>Cần sửa</th><th>NV quá hạn</th><th>Nộp tuần này so với trước</th></tr>${rs.map(r=>`<tr class="cl" tabindex="0" onclick="selId='${r.s.id}';go(1)"><td><b>${esc(r.s.name)}</b>${r.s.active?'':' (ngừng)'}</td><td>${r.gv}</td><td>${r.st.n}</td><td>${fr(r.st.rate)} (${r.st.sub}/${r.st.n})</td><td>${fr(r.st.apr)} (${r.st.ap}/${r.st.ev})</td><td>${r.bb}</td><td>${r.dg}</td><td>${r.st.fix}</td><td>${r.od?pill(r.od,'er'):0}</td><td>${r.tr>0?'▲ +':r.tr<0?'▼ ':'= '}${r.tr}</td></tr>`).join('')}</table></div>`}
const bars=(t,rs,f)=>`<div class="card"><h2>${t}</h2>${rs.map(r=>{const[p,l]=f(r);return`<div class="hb"><span>${esc(r.s.name)}</span><div class="tr"><i style="width:${Math.min(100,p)}%"></i></div><b>${l}</b></div>`}).join('')||'<div class="empty">Chưa có dữ liệu</div>'}</div>`;
/* Dashboard */
let KP=[];
function dash(){const ds=docsF(),s=stats(ds),rs=rows(),od=tasksF().filter(overdue).length;

<div class="card">${docTable(ds.slice((hf.pg-1)*PG,hf.pg*PG))}<div class="bar" style="margin-top:10px"><button class="btn g" ${hf.pg<=1?'disabled':''} onclick="hf.pg--;render()">Trước</button><span>Trang ${hf.pg}/${n} · ${ds.length} hồ sơ</span><button class="btn g" ${hf.pg>=n?'disabled':''} onclick="hf.pg++;render()">Sau</button></div></div>`}
const TRN={nop:{r:['gv'],f:['Chưa nộp','Bản nháp','Thu hồi','Cần chỉnh sửa'],own:1},thuhoi:{r:['gv'],f:['Đã nộp'],own:1,n:1},ver:{r:['gv'],f:['Đã duyệt'],own:1,n:1},rs:{r:['tt'],f:['Đã nộp']},cho:{r:['tt'],f:['Đang rà soát']},duyet:{r:['bgh'],f:['Chờ duyệt']},sua:{r:['tt','bgh'],f:['Đang rà soát','Chờ duyệt'],n:1},tc:{r:['bgh'],f:['Chờ duyệt'],n:1}};

function doneTask(id){const t=D.tasks.find(x=>x.id==id);if(!t||t.done||role=='gv')return;ask('Đánh dấu hoàn thành nhiệm vụ “'+t.title+'”?',()=>{t.done=true;t.doneBy=ME().n;t.doneAt=nowTs();aud('Hoàn thành nhiệm vụ: '+t.title);save();render();toast('Đã đánh dấu hoàn thành')})}
/* Báo cáo, AI, cài đặt */
function bc(){const rs=rows();return filterBar()+`<div class="bar"><span class="sp"></span><button class="btn g" onclick="copyCsv('s')">Tải bảng (CSV)</button></div><div class="card"><h2>So sánh điểm trường</h2>${rs.length?schoolTable(rs):'<div class="empty">Chưa có dữ liệu</div>'}</div><div class="card"><h2>Số hồ sơ theo trạng thái</h2><div class="tw"><table><tr><th>Điểm trường</th>${ALLST.map(x=>`<th>${x}</th>`).join('')}</tr>${rs.map(r=>`<tr><td>${esc(r.s.name)}</td>${ALLST.map(x=>`<td>${cnt(r.ds,x)}</td>`).join('')}</tr>`).join('')}</table></div></div>`}
function ai(){const q=D.docs.filter(d=>d.st=='Đang rà soát'&&(role!='gv'||d.tid==R.gv.tid));return`<div class="card"><h2>Chưa kết nối dịch vụ AI</h2><p>Bản này chưa đọc nội dung hồ sơ và chưa đối chiếu tiêu chí bằng AI. Muốn bật chức năng này cần có:</p><ul><li>Máy chủ xử lý, giữ khóa API và ghi nhật ký</li><li>Trích xuất văn bản từ PDF, DOCX, XLSX</li><li>Bộ tiêu chí có phiên bản và ngày hiệu lực</li></ul><p class="note">Khi chưa có, hồ sơ được rà soát thủ công theo quy trình bên dưới.</p></div><div class="card"><h2>Hồ sơ đang chờ người rà soát (${q.length})</h2>${docTable(q.slice(0,10))}</div>`}
function cfg(){return`<div class="card"><h2>Thông tin hệ thống</h2><p>Trường Tiểu học Đỗ Thúc Tịnh · Năm học 2026–2027 · Học kỳ I · ${D.schools.length} điểm trường</p><p class="note">Dữ liệu mẫu được lưu trong trình duyệt này${persistOK?'':' (hiện không lưu được, dữ liệu sẽ mất khi tải lại trang)'}. Không dùng cho dữ liệu học sinh hoặc dữ liệu nhạy cảm.</p>${role=='ad'?'<button class="btn g" onclick="backup()">Tải bản sao lưu (JSON)</button> <label class="btn g" style="display:inline-block;margin:0">Khôi phục từ tệp<input type="file" accept=".json,application/json" hidden onchange="restore(this)"></label> <button class="btn g" onclick="resetData()">Đặt lại dữ liệu mẫu</button>':''}</div><div class="card"><h2>Nhật ký thao tác</h2>${D.audit.length?`<div class="tw"><table><tr><th>Thời điểm</th><th>Người thực hiện</th><th>Thao tác</th></tr>${D.audit.slice(0,30).map(a=>`<tr><td>${a.at}</td><td>${esc(a.by)} (${esc(a.role)})</td><td>${esc(a.act)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Chưa có thao tác nào được ghi nhận.</div>'}</div>`}
function resetData(){ask('Đặt lại toàn bộ dữ liệu về dữ liệu mẫu ban đầu? Thao tác này không hoàn tác được.',()=>{try{localStorage.removeItem(KEY)}catch(e){}D=seed();selId=null;aud('Đặt lại dữ liệu mẫu');save();render();toast('Đã đặt lại dữ liệu mẫu')})}
function dl(name,text,type){try{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true}catch(e){return false}}
function copyCsv(k){const q=a=>a.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'),sc=`Phạm vi: ${fl.sid?sn(fl.sid):'mọi điểm trường'}; ${fl.to||'mọi tổ'}; tháng ${fl.mo||'mọi'}; hạn từ ${fl.df||'—'} đến ${fl.dt||'—'}${k=='h'?'; trạng thái '+(hf.st||'mọi'):''}; xuất lúc ${nowTs()}`;
const a=k=='h'?[['Mã','Tên','Loại','Người nộp','Điểm trường','Tổ','Hạn','Trạng thái','Quá hạn','Số phiên bản'],...hdocs().map(d=>[d.id,d.name,d.ty,d.tname,sn(d.sid),d.to,d.due||'',d.st,odDoc(d)?'Có':'Không',d.ver.length])]:[['Điểm trường','Giáo viên','Hồ sơ cần nộp','Đã nộp','Chờ duyệt','Đã duyệt','Cần chỉnh sửa','Hồ sơ quá hạn','Nhiệm vụ quá hạn'],...rows().map(r=>[r.s.name,r.gv,r.st.n,r.st.sub,r.st.wait,r.st.ap,r.st.fix,r.st.od,r.od])];
if(dl(k=='h'?'ho-so.csv':'tong-hop.csv','\uFEFF'+q([[sc],...a]),'text/csv;charset=utf-8'))toast('Đã tạo tệp CSV ('+(a.length-1)+' dòng)');else toast('Trình duyệt không tạo được tệp CSV',1)}
function backup(){dl('edumanage-v3-'+TODAY+'.json',JSON.stringify(D,null,1),'application/json')?toast('Đã tạo tệp sao lưu'):toast('Trình duyệt không tạo được tệp sao lưu',1)}
function restore(i){const f=i.files[0];if(!f)return;if(f.size>5e6)return toast('Tệp quá lớn (tối đa 5 MB)',1);const r=new FileReader();r.onerror=()=>toast('Không đọc được tệp',1);r.onload=()=>{let x;try{x=migrate(JSON.parse(r.result))}catch(e){return toast('Tệp không phải JSON hợp lệ',1)}const er=validate(x);if(er)return toast('Không khôi phục: '+er,1);ask('Thay toàn bộ dữ liệu hiện tại bằng dữ liệu trong tệp '+f.name+'?',()=>{D=x;selId=null;aud('Khôi phục dữ liệu từ tệp sao lưu');save();render();toast('Đã khôi phục dữ liệu')})};r.readAsText(f);i.value=''}
function bell(){const L=[],w=cnt(D.docs,'Chờ duyệt'),o=D.tasks.filter(overdue).length,f=D.docs.filter(d=>d.st=='Cần chỉnh sửa'&&d.tid==R.gv.tid).length;
if(role=='bgh'&&w)L.push([`${w} hồ sơ chờ BGH phê duyệt`,"hf.st='Chờ duyệt';hf.ty='';go(3)"]);if(o)L.push([`${o} nhiệm vụ quá hạn`,'go(2)']);if(role=='gv'&&f)L.push([`${f} hồ sơ của bạn cần chỉnh sửa`,"hf.st='Cần chỉnh sửa';hf.ty='';go(3)"]);
$('dlg').innerHTML=`<h2>Thông báo</h2>${L.length?`<ul>${L.map(x=>`<li><a class="l" onclick="$('dlg').close();${x[1]}">${x[0]}</a></li>`).join('')}</ul>`:'<p class="note">Không có thông báo mới.</p>'}<div class="bar"><span class="sp"></span><button class="btn g" onclick="$('dlg').close()">Đóng</button></div>`;$('dlg').showModal()}
/* Điều hướng */
const GR=[['Điều hành',[[0,'📊','Tổng quan'],[1,'🏫','Quản lý 4 điểm trường'],[2,'📌','Giao nhiệm vụ']]],['Chuyên môn',[[3,'📁','Hồ sơ chuyên môn'],[4,'🤖','AI rà soát hồ sơ'],[5,'👥','Sinh hoạt chuyên môn'],[6,'🎓','Dự giờ và đánh giá'],[7,'📈','Báo cáo – Thống kê']]],['Hệ thống',[[8,'✅','Bộ tiêu chí chuyên môn'],[9,'👤','Quản lý người dùng'],[10,'⚙️','Cài đặt hệ thống']]]];
const LB={};GR.forEach(g=>g[1].forEach(i=>LB[i[0]]=i[2]));
const VW={0:dash,1:truong,2:nv,3:hoso,4:ai,5:hoso,6:hoso,7:bc,8:()=>empty('Bộ tiêu chí chuyên môn','Mục này chưa được xây dựng trong bản này.'),9:()=>empty('Quản lý người dùng','Chưa có đăng nhập và quản lý tài khoản; vai trò phía trên chỉ để xem thử.'),10:cfg};
function nav(i){cur=i;selId=null;hf.pg=1;hf.q='';if([3,5,6].includes(i)){hf.st='';hf.ty=i==5?TY[2]:i==6?TY[3]:''}render()}
function go(i){cur=i;render()}
function render(keep){$('nav').innerHTML=GR.map(g=>`<div class="ng">${g[0]}</div>`+g[1].map(i=>`<button class="${i[0]==cur?'on':''}" onclick="nav(${i[0]})">${i[1]} ${i[2]}</button>`).join('')).join('');
$('v').innerHTML=`<h2>${LB[cur]}</h2>`+VW[cur]();const m=ME();$('un').textContent=m.n;$('ul').textContent=m.l;$('av').textContent=m.n.trim().split(' ').pop()[0];
$('rl').value=role;$('bc').textContent='';$('ban').textContent='Bản demo V3 (đợt P0): dữ liệu mẫu lưu trong trình duyệt này. Chưa có đăng nhập, máy chủ hay AI. Vai trò phía trên chỉ để xem thử, không phải xác thực.'+(persistOK?'':' Trình duyệt không cho lưu dữ liệu, thay đổi sẽ mất khi tải lại.');
if(keep){const q=$('q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}}
save();render();
</script></body></html>
